name: flutter_extension
description: "Flutter extension"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons:
  get:
  shared_preferences:
  flutter_svg:
  flutter_spinkit:
  cached_network_image:
  shimmer: 
  intl: ^0.20.2
  file_picker: ^10.3.10
  lottie: ^3.3.2
  image_picker: ^1.2.1
  




dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
flutter:
  uses-material-design: true
  assets: 
    - assets/language/
    - assets/images/
    - assets/icons/
    - assets/lottie/

